<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastNexus - Em Breve</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --g: #00ff88;
      --bg: #050505;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* Esconde a barra de rolagem */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    
    /* Fundo da Constelação */
    #fx {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
    
    /* Caixa de Conteúdo Central */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      background: rgba(5, 5, 5, 0.4);
      border-radius: 24px;
      backdrop-filter: blur(12px); /* Efeito de vidro */
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 136, 0.15);
      max-width: 600px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    
    .logo {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      letter-spacing: -1.5px;
    }
    
    .logo span { 
      color: var(--g); 
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4); 
    }
    
    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #f1f1f1;
    }
    
    /* Container para segurar o espaço da frase que muda */
    .phrase-container {
      min-height: 80px; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .phrase {
      font-size: 1.15rem;
      color: var(--g);
      font-weight: 500;
      line-height: 1.5;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    
    /* Classe para fazer o texto sumir suavemente */
    .phrase.fade { 
      opacity: 0; 
    }
  </style>
</head>
<body>

  <canvas id="fx"></canvas>

  <div class="content">
    <div class="logo">Fast<span>Nexus</span></div>
    <div class="title">Estamos preparando algo incrível.</div>
    
    <div class="phrase-container">
      <div class="phrase" id="dynamic-text">O controle total da sua operação está prestes a ganhar um novo significado.</div>
    </div>
  </div>

  <script>
    // ─── [1] SISTEMA DE FRASES ALTERNADAS ───
    const phrases = [
      "Estamos nos bastidores construindo a sua próxima grande vantagem competitiva.",
      "O próximo grande passo da sua gestão começa aqui. Estamos preparando algo incrível.",
      "Transformando a complexidade do dia a dia em visão estratégica. Em breve.",
      "A evolução que une inteligência de ponta e controle real está chegando."
    ];
    
    let currentPhrase = 0;
    const textElement = document.getElementById('dynamic-text');

    // Troca a frase a cada 4 segundos
    setInterval(() => {
      textElement.classList.add('fade'); // Faz o texto sumir
      
      setTimeout(() => {
        // Muda o texto enquanto está invisível
        currentPhrase = (currentPhrase + 1) % phrases.length;
        textElement.textContent = phrases[currentPhrase];
        
        // Faz o texto aparecer de novo
        textElement.classList.remove('fade');
      }, 600); // Tempo de espera para completar o sumiço
    }, 4000); 

    // ─── [2] PARTICLES (Constelação + Interação do Mouse) ───
    (function(){
      const c = document.getElementById('fx'), x = c.getContext('2d');
      let W, H, pts = [];
      const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight };
      resize(); 
      addEventListener('resize', resize, {passive: true});

      let mouse = { x: null, y: null, radius: 120 };
      addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, {passive: true});
      addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; }, {passive: true});
      
      function P(){ this.reset() }
      P.prototype.reset = function(){
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.r = Math.random() * 2.2 + 0.8; 
        this.speed = Math.random() * .10 + .03;
        this.angle = Math.random() * Math.PI * 2;
        this.alpha = Math.random() * .8 + .4; 
        this.life = 0;
        this.max = Math.random() * 400 + 400; // Vida longa
      };

      P.prototype.tick = function(){
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed - .05;
        
        // Efeito de fuga do mouse
        if (mouse.x != null && mouse.y != null) {
          let dx = this.x - mouse.x; let dy = this.y - mouse.y;
          let d = Math.sqrt(dx*dx + dy*dy);
          if (d < mouse.radius) {
            let f = (mouse.radius - d) / mouse.radius;
            this.x += (dx / d) * f * 3; this.y += (dy / d) * f * 3;
          }
        }
        
        this.life++;
        if (this.life > this.max || this.y < -10 || this.x < -10 || this.x > W + 10) this.reset();
      };

      P.prototype.draw = function(){
        const f = this.life < 100 ? this.life / 100 : this.life > this.max - 100 ? (this.max - this.life) / 100 : 1;
        x.beginPath(); x.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        x.shadowBlur = 8; x.shadowColor = 'rgba(0,255,136,0.8)';
        x.fillStyle = `rgba(0,255,136,${this.alpha * f})`; x.fill();
        x.shadowBlur = 0; 
      };

      // Quantidade de partículas
      const N = innerWidth < 600 ? 50 : 120;
      for(let i = 0; i < N; i++) pts.push(new P());

      (function loop(){
        x.clearRect(0, 0, W, H);
        pts.forEach(p => { p.tick(); p.draw(); });
        
        // Conexões (Linhas)
        for(let i = 0; i < N; i++) {
          for(let j = i + 1; j < N; j++) {
            let dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
            let d = Math.sqrt(dx*dx + dy*dy);
            if(d < 150) { 
              x.beginPath(); x.strokeStyle = `rgba(0, 255, 136, ${(1 - d/150) * 0.3})`; 
              x.lineWidth = 1.5; x.moveTo(pts[i].x, pts[i].y); x.lineTo(pts[j].x, pts[j].y); x.stroke();
            }
          }
        }
        requestAnimationFrame(loop)
      })();
    })();
  </script>
</body>
</html>
